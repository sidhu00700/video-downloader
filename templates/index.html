<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASTER Video Downloader</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{ --bg:#0b0720; --text:#ffffff; --muted:rgba(255,255,255,.60); --card:rgba(255,255,255,.10); --border:rgba(255,255,255,.20); }
body.light{ --bg:#eef4ff; --text:#111827; --muted:rgba(17,24,39,.60); --card:rgba(255,255,255,.72); --border:rgba(15,23,42,.12); }
*{ box-sizing:border-box; }
body{ background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; transition: background .4s ease, color .4s ease; }
.mesh{ position:fixed; inset:0; z-index:-1; overflow:hidden; filter:blur(70px); }
.blob{ position:absolute; border-radius:50%; opacity:.7; animation:drift 18s ease-in-out infinite alternate; }
.b1{ width:46vw; height:46vw; background:#a855f7; top:-10%; left:-8%; }
.b2{ width:42vw; height:42vw; background:#312e81; bottom:-12%; right:-6%; animation-duration:22s; }
.b3{ width:34vw; height:34vw; background:#22d3ee; top:35%; left:40%; animation-duration:26s; opacity:.5; }
@keyframes drift{ to{ transform: translate(8vw,6vh) scale(1.2) rotate(40deg); } }
.glow:focus{ outline:none; border-color:#22d3ee; box-shadow: 0 0 0 3px rgba(34,211,238,.25), 0 0 28px rgba(168,85,247,.55); }
select option{ background:#1e1b4b; color:#fff; }
.light-card{ background:var(--card); border-color:var(--border); }
.muted{ color:var(--muted); }
.theme-toggle{ position:fixed; top:22px; right:22px; z-index:50; width:48px; height:48px; border-radius:16px; display:flex; align-items:center; justify-content:center; background:var(--card); border:1px solid var(--border); backdrop-filter:blur(16px); cursor:pointer; transition: transform .25s ease, background .3s ease, border .3s ease; }
.theme-toggle:hover{ transform:translateY(-2px) scale(1.05); }
.status-dot{ width:7px; height:7px; border-radius:50%; background:#22c55e; display:inline-block; margin-right:6px; box-shadow:0 0 10px rgba(34,197,94,.7); }
.brand-footer{ margin-top:26px; text-align:center; }
.brand-name{ font-size:13px; font-weight:600; letter-spacing:.12em; opacity:.75; }
.code-signature{ margin-top:5px; font-family:ui-monospace,monospace; font-size:11px; opacity:.40; letter-spacing:.04em; }
</style>
</head>
<body class="font-sans flex items-center justify-center p-4">

<div class="mesh">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
  <svg class="sun-icon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M6.35 17.65l-1.42 1.42M19.07 4.93l-1.42 1.42"/></svg>
</button>

<main class="w-full max-w-xl light-card backdrop-blur-xl border shadow-2xl rounded-3xl p-6 sm:p-9">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="text-3xl sm:text-4xl font-semibold tracking-tight">Universal Video Downloader</h1>
      <p class="muted mt-2 text-sm">YouTube · TikTok · Instagram · Facebook · Twitter/X</p>
    </div>
  </div>

  <form id="form" class="mt-7 space-y-4" novalidate>
    <div class="relative">
      <input id="url" type="url" required placeholder="Paste a video link…" autocomplete="off" class="glow w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-4 pr-28 placeholder-white/40 transition-all duration-300">
      <span id="badge" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs px-3 py-1 rounded-full bg-white/10 text-white/60">No link</span>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <label class="text-sm muted">Format
        <select id="format" class="glow mt-1 w-full bg-white/10 border border-white/20 rounded-2xl px-4 py-3 transition-all duration-300">
          <option value="mp4">MP4 (Video)</option>
          <option value="mp3">MP3 (Audio Only)</option>
        </select>
      </label>

      <label class="text-sm muted">Resolution
        <select id="quality" class="glow mt-1 w-full bg-white/10 border border-white/20 rounded-2xl px-4 py-3 transition-all duration-300 disabled:opacity-40">
          <option value="1080">1080p (Full HD)</option>
          <option value="720" selected>720p (HD)</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
        </select>
      </label>
    </div>

    <button id="btn" type="submit" class="w-full flex items-center justify-center gap-3 rounded-2xl py-4 font-semibold bg-gradient-to-r from-purple-500 via-indigo-500 to-cyan-400 shadow-lg shadow-purple-500/35 transition-all duration-300 transform hover:scale-105 active:scale-95 disabled:opacity-70">
      <svg id="spin" class="hidden animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity=".3" stroke-width="4"/><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
      <span id="btnTxt">Download</span>
    </button>
  </form>

  <p id="msg" role="status" class="mt-5 text-sm min-h-[1.25rem]"></p>

  <div class="mt-5 text-center text-xs muted"><span class="status-dot"></span>Downloader ready</div>

  <div class="brand-footer">
    <div class="brand-name">AHMED SIDHU</div>
    <div class="code-signature">&lt;/&gt; ahmed.sidhu</div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const themeToggle = $("themeToggle");

function setTheme(light){
  document.body.classList.toggle("light", light);
  localStorage.setItem("master-theme", light ? "light" : "dark");
}
if(localStorage.getItem("master-theme") === "light") setTheme(true);
themeToggle.addEventListener("click", () => setTheme(!document.body.classList.contains("light")));

const PLATFORMS = [
  ["YouTube", /(youtube\.com|youtu\.be)/i],
  ["TikTok", /tiktok\.com/i],
  ["Instagram", /instagram\.com/i],
  ["Facebook", /(facebook\.com|fb\.watch|fb\.com)/i],
  ["Twitter/X", /(twitter\.com|x\.com|t\.co)/i]
];

const detect = v => (PLATFORMS.find(([,r]) => r.test(v)) || [null])[0];

$("url").addEventListener("input", () => {
  const p = detect($("url").value);
  $("badge").textContent = p || ($("url").value ? "Unknown" : "No link");
  $("badge").className = "absolute right-3 top-1/2 -translate-y-1/2 text-xs px-3 py-1 rounded-full " + (p ? "bg-cyan-400/20 text-cyan-200" : "bg-white/10 text-white/60");
});

$("format").addEventListener("change", () => {
  $("quality").disabled = $("format").value === "mp3";
});

function setBusy(b){
  $("btn").disabled = b;
  $("spin").classList.toggle("hidden", !b);
  $("btnTxt").textContent = b ? "Processing… please wait" : "Download";
}

function say(t, ok){
  $("msg").textContent = t;
  $("msg").className = "mt-5 text-sm min-h-[1.25rem] " + (ok ? "text-emerald-300" : "text-rose-300");
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const url = $("url").value.trim();
  if(!detect(url)) return say("Paste a valid supported video link.", false);

  setBusy(true);
  say("Fetching and preparing your file…", true);

  try {
    const res = await fetch("/api/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, format: $("format").value, quality: $("quality").value })
    });

    const type = res.headers.get("Content-Type") || "";
    if(!res.ok || type.includes("json") || type.includes("text/html")){
      let err = "Download failed.";
      try { const data = await res.json(); err = data.error || err; } catch{}
      throw new Error(err);
    }

    const cd = res.headers.get("Content-Disposition") || "";
    let name = "video." + $("format").value;
    const m = cd.match(/filename\*=UTF-8''([^;]+)/i);
    if(m) name = decodeURIComponent(m[1]);

    const blob = await res.blob();
    if(blob.size < 1024) throw new Error("Received an empty file. Please retry.");

    const a = Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(blob),
      download: name
    });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);

    say("Done! Your download has started.", true);
  } catch(err){
    say(err.message, false);
  } finally {
    setBusy(false);
  }
});
</script>
</body>
</html>
